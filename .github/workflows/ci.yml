name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Reproduce the order-154 Fourier seed baseline
        run: python3 -I -B research/fourier-principal-minors/order-154/verify_seed.py
      - run: python3 examples/sum-of-cubes/check.py
      - name: Verify exact witness certificates
        run: python3 -m unittest discover -s research/marcus-de-oliveira/certificates -p 'test_*.py' -v
      - name: Check numerical geometry fixtures
        run: python3 research/marcus-de-oliveira/search/test_search.py
      - name: Reproduce exact source examples
        run: python3 research/marcus-de-oliveira/literature/check_source_examples.py
      - name: Check forest identities and archived outputs
        working-directory: research/marcus-de-oliveira/baselines
        run: |
          sha256sum --check --quiet SHA256SUMS
          python3 -B -m unittest discover -p 'test_*.py' -v
      - name: Check stress certificates and archived outputs
        working-directory: research/marcus-de-oliveira/rational-stress
        run: |
          sha256sum --check --quiet SHA256SUMS
          python3 -I -B -m unittest discover -p 'test_*.py' -v
      - name: Replay single-cycle weights and the four-cycle obstruction
        working-directory: research/marcus-de-oliveira/single-cycle
        run: |
          sha256sum --check --quiet SHA256SUMS
          python3 -B cover_certificate.py --check four-cycle-obstruction.json
          python3 -B -m unittest discover -p 'test_*.py' -v
      - name: Replay spectrum-dependent four-cycle certificates
        working-directory: research/marcus-de-oliveira/four-cycle-spectral
        run: |
          sha256sum --check --quiet SHA256SUMS
          python3 -B spectral.py --check certificate.json
          python3 -B fiber_certificate.py
          python3 -B -m unittest discover -p 'test_*.py' -v
      - name: Replay moving fourth-eigenvalue weights and their limits
        working-directory: research/marcus-de-oliveira/moving-fourth-spectrum
        run: |
          sha256sum --check --quiet SHA256SUMS
          python3 -B moving.py --check derived.json
          python3 -B positive_box.py
          python3 -B zero_fiber.py
          python3 -B claude_star.py
          python3 -B -m unittest discover -p 'test_*.py' -v
      - name: Verify the four-cycle transition and three-color coupling
        working-directory: research/marcus-de-oliveira
        run: |
          python3 -B fourth-boundary/boundary.py
          python3 -B -m unittest discover -s fourth-boundary -p 'test_*.py' -v
          python3 -B fourth-boundary-plane/plane.py
          python3 -B -m unittest discover -s fourth-boundary-plane -p 'test_*.py' -v
          python3 -B three-color-coupling/coupling.py
          python3 -B -m unittest discover -s three-color-coupling -p 'test_*.py' -v
      - name: Check the six-site paired matching and coloring laws
        run: python3 -I -B research/marcus-de-oliveira/paired-matching-boundary/check.py
      - name: Check the five alternating triple correlations
        run: python3 -I -B research/marcus-de-oliveira/five-alternating-triples/check.py
      - name: Replay the complex qubit Fourier coloring certificate
        working-directory: research/marcus-de-oliveira/qubit-fourier-orientation
        run: |
          python3 -B verify.py
          python3 -B -m unittest discover -p 'test_*.py' -v
      - name: Verify the complex second-eigenvalue rectangle
        working-directory: research/marcus-de-oliveira/complex-second-region
        run: |
          sha256sum --check --quiet SHA256SUMS
          python3 -B check.py
          python3 -B -m unittest discover -p 'test_*.py' -v
      - name: Verify the two-sided paired-spectrum results and their limits
        working-directory: research/marcus-de-oliveira
        run: |
          python3 -I -B double-paired-contingencies/check.py
          python3 -I -B quaternionic-paired-spectra/check.py
          python3 -I -B grouped-contact-reduction/check.py
          python3 -I -B contact-reduction-review/sanity.py
          (cd paired-pointwise-cone && sha256sum --check --quiet SHA256SUMS)
          python3 -B paired-pointwise-cone/check.py
          python3 -B -m unittest discover -s paired-pointwise-cone -p 'test_*.py' -v
          python3 -I -B double-paired-five-term/check.py | diff - double-paired-five-term/replay.json
          python3 -I -B paired-triangular-spectra/check.py
      - name: Verify the universal double-paired Grassmann certificates
        working-directory: research/marcus-de-oliveira
        run: |
          python3 -I -B double-paired-five-term/grassmann.py
          python3 -I -B double-paired-five-term/grassmann_fixtures.py
      - name: Verify the nontriangular paired spectral edge certificates
        working-directory: research/marcus-de-oliveira
        run: |
          python3 -I -B paired-spectral-hull-edges/check.py
          python3 -I -O -B paired-spectral-hull-edges/check.py
          python3 -I -B -m unittest discover -s paired-spectral-hull-edges -p 'test_*.py' -v
      - name: Verify independent eigenvalue and unitary perturbations
        run: python3 -I -B research/marcus-de-oliveira/paired-stability-all-eigenvalues/check.py
      - name: Verify the split-pair criterion and uniform row orientations
        working-directory: research/marcus-de-oliveira
        run: |
          (cd split-one-eigenvalue-pair && sha256sum --check --quiet SHA256SUMS)
          python3 -I -B split-one-eigenvalue-pair/check.py
          python3 -B -m unittest discover -s split-one-eigenvalue-pair -p 'test_*.py' -v
          (cd split-row-orientations && sha256sum --check --quiet SHA256SUMS)
          python3 -I -B split-row-orientations/check.py
          python3 -B -m unittest discover -s split-row-orientations -p 'test_*.py' -v
      - name: Verify exact split dual rays and coarsening certificates
        working-directory: research/marcus-de-oliveira
        run: |
          (cd split-dual-rays && sha256sum --check --quiet SHA256SUMS)
          python3 -I -B split-dual-rays/check.py
          python3 -I -O -B split-dual-rays/check.py
          python3 -I -B split-dual-rays/test_check.py
          (cd split-dual-coarsening && sha256sum --check --quiet SHA256SUMS)
          python3 -I -B split-dual-coarsening/check.py
          python3 -I -O -B split-dual-coarsening/check.py
          python3 -I -B split-dual-coarsening/test_check.py
      - name: Verify orientation-dependent parent laws and their obstruction
        working-directory: research/marcus-de-oliveira
        run: |
          (cd common-parent-obstruction && sha256sum --check --quiet SHA256SUMS)
          python3 -I -B common-parent-obstruction/check.py
          python3 -B -m unittest discover -s common-parent-obstruction -p 'test_*.py' -v
      - name: Verify balanced and unequal isoclinic split planes
        working-directory: research/marcus-de-oliveira
        run: |
          python3 -I -O -B split-physical-compression/check.py
          python3 -I -O -B isoclinic-split-planes/check.py
      - name: Verify aligned projection triples and the nonscalar orientation family
        working-directory: research/marcus-de-oliveira
        run: |
          python3 -I -O -B commuting-split-projections/check.py
          python3 -I -O -B commuting-split-projections/orientations.py
      - name: Replay archived exact split-ray endpoints
        working-directory: research/marcus-de-oliveira
        run: |
          (cd split-physical-ray-search && sha256sum --check --quiet SHA256SUMS)
          python3 -I -B split-physical-ray-search/check.py
          python3 -B -m unittest discover -s split-physical-ray-search -p 'test_*.py' -v
      - name: Verify the common-minor neighborhood and exact obstruction fixture
        run: python3 -I -B research/marcus-de-oliveira/common-minor-neighborhood/check.py
      - name: Verify rank-one rotations and the small-minor boundary
        working-directory: research/marcus-de-oliveira
        run: |
          python3 -B reflection-angles/check.py | diff - reflection-angles/results.json
          python3 -B reflection-angles/check_packing.py | diff - reflection-angles/packing-results.json
          (cd star-small-ratio && sha256sum --check --quiet SHA256SUMS)
          python3 -B star-small-ratio/verify.py
          python3 -B star-small-ratio/verify_zero_stratum.py
      - name: Replay gluing, nonnormal interfaces and pole compression
        working-directory: research/marcus-de-oliveira
        run: |
          python3 -B pointwise-gluing/check.py
          python3 -B pointwise-gluing/interface.py
          python3 -B pole-compression/check.py
          python3 -B two-spectator-pencils/check.py
      - name: Check the color exchanges, two-row star criterion and normal pole lifts
        working-directory: research/marcus-de-oliveira
        run: |
          python3 -B three-color-exchanges/exchanges.py
          python3 -B -m unittest discover -s three-color-exchanges -p 'test_*.py' -v
          (cd star-two-row && sha256sum --check --quiet SHA256SUMS)
          python3 -B star-two-row/verify.py
          python3 -B star-two-row/scan.py
          (cd star-zero-sector && sha256sum --check --quiet SHA256SUMS)
          python3 -B star-zero-sector/verify.py
          python3 -B normal-pole-step/check.py | diff - normal-pole-step/certificate.json
          python3 -B normal-pole-step/archive_slices.py
          python3 -B fourier-minor-laws/check.py
          python3 -B fourier-seven/check.py
          python3 -B fourier-composite-laws/check.py
          python3 -B principally-balanced-local/check.py
          python3 -B -m unittest discover -s principally-balanced-local -p 'test_*.py' -v
          (cd full-four-cycle && sha256sum --check --quiet SHA256SUMS)
          python3 -B full-four-cycle/check.py
          (cd two-middle-positive-laws && sha256sum --check --quiet SHA256SUMS)
          python3 -B two-middle-positive-laws/check.py
          python3 -B -m unittest discover -s two-middle-positive-laws -p 'test_*.py' -v
          python3 -B second-bernstein-segment/check.py
          python3 -B second-bernstein-segment/check.py 1/2 -7/3 11/5 > /dev/null
          python3 -B -m unittest discover -s full-four-cycle -p 'test_*.py' -v
          python3 -B two-free-rank-one/check.py
          python3 -B rankone-quantitative/radius.py
          python3 -B -m unittest discover -s rankone-quantitative -p 'test_*.py' -v
          python3 -B two-free-real-atlas/check.py
          python3 -B -m unittest discover -s two-free-real-atlas -p 'test_*.py' -v
          python3 -B complex-direction-cover/check.py
          python3 -B complex-direction-cover/grid_replay.py
          python3 -B projective-fiber-stability/check.py
          python3 -B projective-fiber-stability/uniform/verify.py
          python3 -B projective-fiber-stability/uniform/weights.py
          python3 -B projective-fiber-stability/uniform/weights.py -3/5 7/10 1/2048 -1/4096 > /dev/null
          python3 -B uniform-fourth-radius/check.py --check uniform-fourth-radius/certificate.json
          python3 -B -m unittest discover -s uniform-fourth-radius -p 'test_*.py' -v
          python3 -B -m unittest discover -s complex-direction-cover -p 'test_*.py' -v
          python3 -B quartic-direction-patches/patches.py
          python3 -B quartic-direction-patches/derive.py
          python3 -B -m unittest discover -s quartic-direction-patches -p 'test_*.py' -v
      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: formal
          auto-config: 'false'
          build: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Check the formal statements and their axiom dependencies
        run: python3 formal/check.py
      - run: npm run build
